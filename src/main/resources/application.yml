server:
  port: 8081

spring:
  application:
    name: fiap-x-video-processor

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fiapx_db}
    username: ${DB_USER:fiapx_user}
    password: ${DB_PASSWORD:fiapx_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: ${WORKER_CONCURRENCY:2}
        max-concurrency: ${WORKER_MAX_CONCURRENCY:5}
        prefetch: 1

storage:
  base-path: ${STORAGE_PATH:./storage_data}

rabbitmq:
  exchange:
    video: video.exchange
  queue:
    video-process: video.process.queue
    video-dlq: video.process.dlq
  routing-key:
    video-process: video.process.key
    video-dlq: video.process.dlq.key

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
