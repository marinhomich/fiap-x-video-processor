spring:
  datasource:
    url: jdbc:h2:mem:fiapx_processor_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

storage:
  base-path: ./target/test_processor_storage

rabbitmq:
  exchange:
    video: video.exchange
  queue:
    video-process: video.process.queue
    video-dlq: video.process.dlq
  routing-key:
    video-process: video.process.key
    video-dlq: video.process.dlq.key
